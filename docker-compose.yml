version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: saudi_electronics_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: saudi_electronics_2026
      POSTGRES_DB: saudi_electronics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - saudi_tech_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saudi_electronics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saudi_electronics_backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: saudi_electronics_2026
      DB_NAME: saudi_electronics_db
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saudi_tech_network

  # 3. Vite React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saudi_electronics_frontend
    restart: always
    environment:
      VITE_BACKEND_URL: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - saudi_tech_network

volumes:
  postgres_data:

networks:
  saudi_tech_network:
    driver: bridge
